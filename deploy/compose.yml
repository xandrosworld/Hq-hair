name: hqhaircrm
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    init: true
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      APP_REVISION: ${APP_REVISION}
    volumes:
      - /opt/hqhaircrm/data:/data
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/hqhaircrm/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
